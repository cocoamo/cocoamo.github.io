# Chirpy theme configuration
theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: 모모의 공부일지
tagline: 개발과 공부를 기록하는 공간
description: 개발 공부와 기술 기록을 정리하는 블로그입니다.

url: "https://cocoamo.github.io"
baseurl: ""

github:
  username: cocoamo

social:
  name: 모모의 공부일지
  links:
    - https://github.com/cocoamo

theme_mode:
toc: true
paginate: 10

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - update.sh
  - requirements.txt
